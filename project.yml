name: LetsRaffle
options:
  bundleIdPrefix: com.letsraffle
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9RHWLJA274
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  LetsRaffle:
    type: application
    platform: iOS
    sources:
      - LetsRaffle
      - Shared
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: LetsRaffleWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.letsraffle.ios
        PRODUCT_NAME: "Lets Raffle"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lets Raffle"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to scan invite QR codes."
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: LetsRaffle/Resources/LetsRaffle.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.security.application-groups: [group.com.letsraffle.ios]
    info:
      path: LetsRaffle/Resources/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        WEB_BASE_URL: $(WEB_BASE_URL)
        CFBundleLocalizations: [tr, en]
        # Red launch screen so the app never flashes white before the logo + fairy-light loader.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: [Fraunces_700Bold.ttf, Fraunces_900Black.ttf, GreatVibes_400Regular.ttf, Nunito_500Medium.ttf, Nunito_600SemiBold.ttf, Nunito_700Bold.ttf, Nunito_800ExtraBold.ttf, Nunito_900Black.ttf]
        # iOS OAuth client of the "letsraffle" Google Cloud project (public identifier, not a secret).
        GIDClientID: 536662543605-lefv2ehup00m2nan2peh0ir0gkmsksvg.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: com.letsraffle.ios
            CFBundleURLSchemes: [letsraffle]
          - CFBundleURLName: google-signin
            CFBundleURLSchemes: [com.googleusercontent.apps.536662543605-lefv2ehup00m2nan2peh0ir0gkmsksvg]
  LetsRaffleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LetsRaffleWidgets
      - Shared
      - LetsRaffle/DesignSystem/Theme.swift
      - LetsRaffle/DesignSystem/Illustrations/ChristmasTree.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.letsraffle.ios.widgets
        PRODUCT_NAME: LetsRaffleWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lets Raffle"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: LetsRaffleWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LetsRaffleWidgets/LetsRaffleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.letsraffle.ios]
  LetsRaffleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LetsRaffleTests
    dependencies:
      - target: LetsRaffle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lets Raffle.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lets Raffle"
schemes:
  LetsRaffle:
    build:
      targets:
        LetsRaffle: all
        LetsRaffleWidgets: all
        LetsRaffleTests: [test]
    test:
      targets:
        - LetsRaffleTests
